# A Firebase web config is not a credential. It identifies a project, it
# authorises nothing, and it has to reach the browser to work at all — there is
# no version of web analytics where it stays private. Secret scanning sees a
# `AIza…` string and reports a leaked Google API key, which is the right default
# and the wrong answer here.
#
# Scoped to the one file rather than to `docs/**`, so a key that genuinely does
# not belong in the repo still gets caught if it lands anywhere else.
paths-ignore:
  - "docs/analytics.js"
