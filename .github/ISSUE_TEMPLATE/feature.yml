name: Feature request
description: Something the tool should be able to do and cannot.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: >
        The situation, not the solution. A described problem often has a better
        answer than the feature that was asked for.
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: How do you do it today
      description: The workaround, if there is one, and where it breaks down.

  - type: textarea
    id: idea
    attributes:
      label: What you had in mind
      description: Optional. Sketches and screenshots are welcome.
